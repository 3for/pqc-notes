[project]
site_name = "PQC Notes"
site_description = "深入探索后量子密码：从论文与标准到实际实现，涵盖格密码学与区块链后量子迁移。"
site_url = "https://3for.github.io/pqc-notes/"
repo_url = "https://github.com/3for/pqc-notes"
repo_name = "3for/pqc-notes"
copyright = '中文整理：<a href="https://github.com/3for">3for</a> · PQC Notes'
docs_dir = "docs"
site_dir = "site"
nav = [
  { "首页" = "index.md" },
  { "基础格密码学" = "basic-lattice-cryptography-notes-zh.md" },
  { "PQC 与区块链" = [
    { "专题导读" = "blockchain/index.md" },
    { "区块链后量子迁移现状" = "blockchain/pqc-migration.md" },
  ] },
]
extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = [
  "assets/javascripts/mathjax.js",
  "assets/vendor/mathjax/tex-chtml.js",
]

[project.theme]
language = "zh"
variant = "classic"
custom_dir = "overrides"
font = false
# Body search highlighting can replace TeX text nodes during MathJax rendering.
# Search result highlighting and section links still work without this feature.
features = ["navigation.top", "navigation.tracking", "toc.follow", "toc.integrate"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle = { icon = "material/brightness-7", name = "切换到深色模式" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle = { icon = "material/brightness-4", name = "切换到浅色模式" }

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/3for/pqc-notes"
name = "GitHub：3for/pqc-notes"

[project.markdown_extensions.toc]
permalink = true
toc_depth = 4

[project.markdown_extensions.tables]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
smart_dollar = false
